<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('upload.upload') }}">Dosya Yükle</a></li>
                <li><a href="{{ url_for('web_adres.web_adres_ekle') }}">Web Kaynağı Ekle</a></li>
                <li><a href="{{ url_for('chat.chat') }}">RAG Chat</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2025 Flask App with Jinja</p>
    </footer>
    
    {% block scripts %}{% endblock %}
</body>
</html>

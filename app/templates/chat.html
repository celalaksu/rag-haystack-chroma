{% extends "base.html" %}

{% block extra_css %}
<style>
    .chat-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    
    .chat-messages {
        height: 400px;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 10px;
        margin-bottom: 20px;
        background-color: #f9f9f9;
    }
    
    .message {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
    }
    
    .user-message {
        background-color: #e3f2fd;
        border-left: 4px solid #2196F3;
        text-align: right;
    }
    
    .bot-message {
        background-color: #f1f1f1;
        border-left: 4px solid #4CAF50;
        text-align: left;
    }
    
    .input-container {
        display: flex;
        gap: 10px;
    }
    
    .input-container input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    
    .input-container button {
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    
    .input-container button:hover {
        background-color: #45a049;
    }
    
    .loading {
        text-align: center;
        margin-top: 10px;
        display: none;
    }
    
    .loading-dots {
        display: inline-block;
    }
    
    .loading-dots::after {
        content: '.';
        animation: dots 1.5s steps(5, end) infinite;
    }
    
    @keyframes dots {
        0%, 20% {
            content: '.';
        }
        40% {
            content: '..';
        }
        60% {
            content: '...';
        }
        80%, 100% {
            content: '';
        }
    }

    /* Markdown styles */
    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
        margin-top: 0.5em;
        margin-bottom: 0.5em;
        font-weight: bold;
    }

    .markdown-content h1 { font-size: 1.8em; }
    .markdown-content h2 { font-size: 1.6em; }
    .markdown-content h3 { font-size: 1.4em; }

    .markdown-content code {
        background-color: #f0f0f0;
        padding: 2px 4px;
        border-radius: 3px;
        font-family: monospace;
    }

    .markdown-content pre {
        background-color: #f0f0f0;
        padding: 1em;
        border-radius: 5px;
        overflow-x: auto;
        margin: 1em 0;
    }

    .markdown-content pre code {
        background-color: transparent;
        padding: 0;
        border-radius: 0;
        display: block;
        font-family: 'Courier New', Courier, monospace;
        white-space: pre;
    }

    /* CodeHilite styles */
    .codehilite {
        background-color: #f8f8f8;
        border-radius: 5px;
        padding: 1em;
        margin: 1em 0;
        overflow-x: auto;
    }

    .codehilite .hll { background-color: #ffffcc }
    .codehilite .c { color: #408080; font-style: italic } /* Comment */
    .codehilite .k { color: #008000; font-weight: bold } /* Keyword */
    .codehilite .o { color: #666666 } /* Operator */
    .codehilite .ch { color: #408080; font-style: italic } /* Comment.Hashbang */
    .codehilite .cm { color: #408080; font-style: italic } /* Comment.Multiline */
    .codehilite .cp { color: #BC7A00 } /* Comment.Preproc */
    .codehilite .cpf { color: #408080; font-style: italic } /* Comment.PreprocFile */
    .codehilite .c1 { color: #408080; font-style: italic } /* Comment.Single */
    .codehilite .cs { color: #408080; font-style: italic } /* Comment.Special */
    .codehilite .gd { color: #A00000 } /* Generic.Deleted */
    .codehilite .ge { font-style: italic } /* Generic.Emph */
    .codehilite .gr { color: #FF0000 } /* Generic.Error */
    .codehilite .gh { color: #000080; font-weight: bold } /* Generic.Heading */
    .codehilite .gi { color: #00A000 } /* Generic.Inserted */
    .codehilite .go { color: #888888 } /* Generic.Output */
    .codehilite .gp { color: #000080; font-weight: bold } /* Generic.Prompt */
    .codehilite .gs { font-weight: bold } /* Generic.Strong */
    .codehilite .gu { color: #800080; font-weight: bold } /* Generic.Subheading */
    .codehilite .gt { color: #0044DD } /* Generic.Traceback */
    .codehilite .kc { color: #008000; font-weight: bold } /* Keyword.Constant */
    .codehilite .kd { color: #008000; font-weight: bold } /* Keyword.Declaration */
    .codehilite .kn { color: #008000; font-weight: bold } /* Keyword.Namespace */
    .codehilite .kp { color: #008000 } /* Keyword.Pseudo */
    .codehilite .kr { color: #008000; font-weight: bold } /* Keyword.Reserved */
    .codehilite .kt { color: #B00040 } /* Keyword.Type */
    .codehilite .m { color: #666666 } /* Literal.Number */
    .codehilite .s { color: #BA2121 } /* Literal.String */

    .markdown-content blockquote {
        border-left: 4px solid #cccccc;
        padding-left: 1em;
        margin-left: 0;
        color: #666;
    }

    .markdown-content ul, .markdown-content ol {
        padding-left: 2em;
    }

    .markdown-content table {
        border-collapse: collapse;
        width: 100%;
    }

    .markdown-content table, .markdown-content th, .markdown-content td {
        border: 1px solid #ddd;
    }

    .markdown-content th, .markdown-content td {
        padding: 8px;
        text-align: left;
    }

    .markdown-content a {
        color: #0066cc;
        text-decoration: none;
    }

    .markdown-content a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="chat-container">
    <h1>RAG Chat</h1>
    <p>RAG döküman içerikleriniz hakkında sorular sorun ve yanıtları alın.</p>
    
    <div class="chat-messages" id="chatMessages"></div>
    
    <div class="loading" id="loading">
        <span>Yanıt üretiliyor<span class="loading-dots"></span></span>
    </div>
    
    <div class="input-container">
        <input type="text" id="userInput" placeholder="Sorunuzu buraya yazın..." autocomplete="off">
        <button id="sendButton">Gönder</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const loading = document.getElementById('loading');
        
        // Enter tuşu ile gönderme
        userInput.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Gönderme butonu
        sendButton.addEventListener('click', sendMessage);
        
        function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;
            
            // Kullanıcı mesajını ekle
            addMessage(message, 'user');
            
            // Input'u temizle
            userInput.value = '';
            
            // Yükleniyor göstergesini göster
            loading.style.display = 'block';
            
            // Mesajı sunucuya gönder
            fetch('/query', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query: message })
            })
            .then(response => response.json())
            .then(data => {
                // Yükleniyor göstergesini gizle
                loading.style.display = 'none';
                
                // Bot yanıtını ekle
                if (data.error) {
                    addMessage('Hata: ' + data.error, 'bot');
                } else {
                    // Use HTML version if available, otherwise fall back to plain text
                    addMessageHTML(data.answer_html || data.answer, 'bot');
                }
                
                // Otomatik kaydırma
                chatMessages.scrollTop = chatMessages.scrollHeight;
            })
            .catch(error => {
                // Yükleniyor göstergesini gizle
                loading.style.display = 'none';
                
                // Hata mesajını ekle
                addMessage('Bir hata oluştu: ' + error, 'bot');
                console.error('Error:', error);
            });
        }
        
        function addMessage(text, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
            
            const messageText = document.createElement('div');
            messageText.textContent = text;
            
            messageElement.appendChild(messageText);
            chatMessages.appendChild(messageElement);
            
            // Otomatik kaydırma
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // New function to add HTML message with markdown support
        function addMessageHTML(htmlContent, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
            
            const messageText = document.createElement('div');
            messageText.classList.add('markdown-content');
            messageText.innerHTML = htmlContent;
            
            messageElement.appendChild(messageText);
            chatMessages.appendChild(messageElement);
            
            // Otomatik kaydırma
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    });
</script>
{% endblock %}
